<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikadi Membership</title>
<meta name="description" content="Nikadi Guest House membership: check your points, see your rewards and stay history.">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nikadi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <div class="demo-flag" id="demoFlag" hidden>Demo mode · sample data</div>
  <header class="bar pad">
    <a class="brand" href="../"><b>NIKADI</b><span>Membership</span></a>
    <button class="iconbtn" id="topBtn" type="button" hidden></button>
  </header>
  <main class="pad" id="view" aria-live="polite"></main>
  <nav class="tabs t5" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" data-tab="card" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>Card</button>
    <button class="tab" role="tab" data-tab="benefits" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8L3.5 9.2l5.9-.9z"/></svg>Benefits</button>
    <button class="tab" role="tab" data-tab="book" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"/></svg>Book</button>
    <button class="tab" role="tab" data-tab="stays" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18v-6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6M3 14h18M6 9V6h4v3"/></svg>Stays</button>
    <button class="tab" role="tab" data-tab="rewards" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-6-1s4 1 6 1c2 0 6 1 6-1s-4-3-6 1z"/></svg>Rewards</button>
  </nav>
</div>

<script src="core.js"></script>
<script src="demo.js"></script>
<script>
(function(){
  var view=document.getElementById('view'),tabs=document.getElementById('tabs'),topBtn=document.getElementById('topBtn');
  var TIERS=[
    {key:'silver',name:'Silver',nights:0,discount:5,earn:1,birthday:50,perks:[{id:'rate',text:'5% member rate on every booking'},{id:'points',text:'1 point for every ₹100 of room tariff'},{id:'welcome',text:'100 welcome points when you join'},{id:'offers',text:'Member-only offers on WhatsApp'},{id:'birthday',text:'50 bonus points in your birthday month'}]},
    {key:'gold',name:'Gold',nights:15,discount:10,earn:1.5,birthday:100,perks:[{id:'rate',text:'10% member rate on every booking'},{id:'points',text:'1.5 points for every ₹100 of room tariff'},{id:'earlyci',text:'Early check-in from 9 AM, when available',onsite:true},{id:'birthday',text:'100 bonus points in your birthday month'}]},
    {key:'platinum',name:'Platinum',nights:40,discount:15,earn:2,birthday:100,perks:[{id:'rate',text:'15% member rate on every booking'},{id:'points',text:'2 points for every ₹100 of room tariff'},{id:'latecheckout',text:'Free late check-out till 11 AM (usually ₹1,500)',onsite:true},{id:'upgrade',text:'Free room upgrade, when available',onsite:true},{id:'dental',text:'Free dental kit every stay',onsite:true}]},
    {key:'plus',name:'Platinum Plus',nights:100,discount:20,earn:4,birthday:100,perks:[{id:'rate',text:'20% member rate on every booking'},{id:'points',text:'4 points for every ₹100 of room tariff'},{id:'latecheckout',text:'Free late check-out till 12 noon',onsite:true},{id:'mattress',text:'Free extra mattress when needed',onsite:true},{id:'festival',text:'Priority booking for festivals (Gaura Purnima, Kartik)'},{id:'hold',text:'Your level is kept for 10 years'}]}];
  var RATES={'Deluxe Double (King)':5000,'Deluxe Twin':4500,'Large Twin':5000};
  var S={token:nkStore('nk_token'),member:null,history:[],stays:{stays:[],bookings:[]},cfg:{pointsPer100:1,welcome:100,discountPoints:100,discountValue:500,freeNightPoints:500,channel:'email',tiers:TIERS,rates:RATES,plusYears:10,windowYears:2},tab:'card'};
  if(NIKADI.demo)document.getElementById('demoFlag').hidden=false;
  var installEvt=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;var b=document.getElementById('installBox');if(b)b.hidden=false;});
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var POLICY='To confirm a booking we need an advance of 50% of the total room price. Cancel 3 or more days before check-in and we refund the full advance. Cancellations less than 3 days before check-in, on the day of arrival, or no-shows are not refunded.';

  function $(id){return document.getElementById(id);}
  function busy(btn,on){if(btn){btn.classList.toggle('busy',on);btn.disabled=on;}}
  function toast(t){var d=document.createElement('div');d.className='toast fade';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}
  function show(html){view.innerHTML='<div class="fade" style="display:grid;gap:22px">'+html+'</div>';window.scrollTo(0,0);}
  function setTop(label,fn){topBtn.hidden=!label;topBtn.textContent=label||'';topBtn.onclick=fn||null;}
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dS(ymd){if(!ymd)return '';var p=String(ymd).slice(0,10).split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0];}
  function today(){return new Date(Date.now()+330*60000).toISOString().slice(0,10);}
  function addDays(ymd,n){var p=ymd.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10);}
  function nightsOf(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5);}
  function tiers(){return S.cfg.tiers||TIERS;}
  function tierBy(k){return tiers().filter(function(t){return t.key===k;})[0]||tiers()[0];}
  function earnTxt(e){return (e%1?e.toFixed(1):e)+' point'+(e===1?'':'s');}

  /* ---------- card + progress ---------- */
  function cardHTML(m,ghost){
    var pts=m?m.points:0,val=Math.floor(pts/S.cfg.discountPoints)*S.cfg.discountValue,tk=m&&m.tierKey?m.tierKey:'silver';
    return '<div class="mcard tier-'+(ghost?'ghost':tk)+(ghost?' ghost':'')+'" role="img" aria-label="'+(m?nkEsc(m.firstName)+'\'s '+nkEsc(m.tier||'Silver')+' membership card, '+pts+' points':'Nikadi membership card')+'">'+
      '<div class="mc-top"><span class="mc-brand">NIKADI</span><span class="mc-tier">'+(m?nkEsc(m.tier||'Silver'):'Member')+'</span></div>'+
      '<div class="mc-mid"><div class="mc-pts"><b>'+(m?pts.toLocaleString('en-IN'):'—')+'</b><span>points</span></div>'+
      (m?'<span class="mc-val">'+(val>0?'Worth '+nkInr(val)+' off your next stay':'Keep earning to unlock rewards')+'</span>':'<span class="mc-val">Join free to get '+S.cfg.welcome+' welcome points</span>')+'</div>'+
      '<div class="mc-bot"><div><div class="mc-name">'+(m?nkEsc(m.name||m.firstName):'Your name')+'</div><div class="mc-id">'+(m?'+91 '+nkEsc(m.masked):'+91 ••••• •••••')+'</div></div>'+
      '<div class="mc-since">'+(m&&m.tierKey==='plus'&&m.plusUntil?'Platinum Plus<br>until '+nkEsc(m.plusUntil):m&&m.joined?'Member since<br>'+nkEsc(String(m.joined).replace(/,.*$/,'')):'Sri Dham<br>Mayapur')+'</div></div></div>';
  }
  function tierProgress(m){
    if(m.tierKey==='plus')return '<div class="prog"><div class="prog-top"><span><b>Platinum Plus</b>, our highest level, is yours until '+nkEsc(m.plusUntil||'')+'.</span></div><div class="track"><div class="fill" data-w="100"></div></div></div>';
    var n=m.next;if(!n)return '';
    var cur=n.name==='Platinum Plus'?m.nightsAll:m.nights2y,pct=Math.min(100,cur/n.nights*100);
    return '<div class="prog"><div class="prog-top"><span><b>'+n.need+'</b> more night'+(n.need===1?'':'s')+' to <b>'+nkEsc(n.name)+'</b></span><span class="small">'+cur+'/'+n.nights+'</span></div>'+
      '<div class="track"><div class="fill" data-w="'+pct.toFixed(1)+'"></div></div>'+
      '<p class="small">'+(n.name==='Platinum Plus'?'Counts every night you have ever stayed with us.':'Counts nights stayed in the last '+S.cfg.windowYears+' years.')+'</p></div>';
  }
  function pointsProgress(pts){
    var goal=S.cfg.freeNightPoints,left=Math.max(0,goal-pts%goal),pct=Math.min(100,(pts%goal)/goal*100),nights=Math.floor(pts/goal);
    return '<div class="prog"><div class="prog-top"><span>'+(nights>0?'<b>'+nights+' free night'+(nights>1?'s':'')+' available.</b> ':'')+(left>0?'<b>'+left+'</b> points to '+(nights>0?'another':'a')+' free night':'')+'</span><span class="small">'+(pts%goal)+'/'+goal+'</span></div>'+
      '<div class="track"><div class="fill" data-w="'+pct.toFixed(1)+'"></div></div></div>';
  }
  function animateFill(){setTimeout(function(){document.querySelectorAll('.fill').forEach(function(f){f.style.width=f.dataset.w+'%';});},60);}
  function ladderHTML(cur){
    return '<div class="ladder">'+tiers().map(function(t){
      return '<div class="rung tier-'+t.key+(cur===t.key?' on':'')+'" role="button" tabindex="0" data-rung="'+t.key+'"><span class="rung-dot"></span><div><b>'+nkEsc(t.name)+(cur===t.key?' <em>· you</em>':'')+'</b><small>'+(t.nights?(t.key==='plus'?t.nights+' nights in total · kept '+S.cfg.plusYears+' years':t.nights+' nights in '+S.cfg.windowYears+' years'):'When you join')+'</small></div>'+
        '<div class="rung-perk"><b>'+t.discount+'% off</b><small>'+earnTxt(t.earn)+' / ₹100</small></div></div>';
    }).join('')+'</div>';
  }
  /* ---------- benefits ---------- */
  function perksOf(key){var out=[],idx={},ts=tiers();for(var i=0;i<ts.length;i++){(ts[i].perks||[]).forEach(function(p){var row={id:p.id,text:p.text,onsite:!!p.onsite,from:ts[i].key,fromName:ts[i].name};if(idx.hasOwnProperty(p.id))out[idx[p.id]]=row;else{idx[p.id]=out.length;out.push(row);}});if(ts[i].key===key)break;}return out;}
  function tierIndex(k){var ts=tiers();for(var i=0;i<ts.length;i++)if(ts[i].key===k)return i;return 0;}
  var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  function benefitsHTML(sel,mine){
    var ts=tiers(),t=tierBy(sel),si=tierIndex(sel),mi=mine?tierIndex(mine):-1,m=S.member;
    var minePerks=mine?perksOf(mine):[],mineText={};minePerks.forEach(function(p){mineText[p.id]=p.text;});
    var status;
    if(!mine)status=t.nights?(t.key==='plus'?'Reach '+t.nights+' nights in total':'Stay '+t.nights+' nights in '+S.cfg.windowYears+' years'):'Yours as soon as you join';
    else if(si===mi)status='Your level'+(t.key==='plus'&&m.plusUntil?' · kept until '+nkEsc(m.plusUntil):'');
    else if(si<mi)status='Included in your '+nkEsc(tierBy(mine).name)+' benefits';
    else{var cur=t.key==='plus'?m.nightsAll:m.nights2y,need=Math.max(0,t.nights-cur);status=need+' more night'+(need===1?'':'s')+' to unlock'+(t.key==='plus'?'':' (in '+S.cfg.windowYears+' years)');}
    var locked=mine&&si>mi;
    var list=perksOf(sel).map(function(p){
      var isNew=p.from===sel&&si>0,better=locked&&mineText[p.id]!==p.text;
      return '<li class="perk'+(locked?' locked':'')+(isNew?' new':'')+'"><span class="pk-ic">'+(locked&&better?ICON_LOCK:ICON_CHECK)+'</span><span class="pk-t">'+nkEsc(p.text)+
        (isNew?'<em>New at '+nkEsc(t.name)+'</em>':p.from!==sel?'<small>from '+nkEsc(p.fromName)+'</small>':'')+(locked&&better?'<em class="up">Better than yours</em>':'')+'</span></li>';
    }).join('');
    return '<div class="lvl-tabs" role="tablist">'+ts.map(function(x,i){return '<button type="button" role="tab" class="lt tier-'+x.key+'" data-lvl="'+x.key+'" aria-selected="'+(x.key===sel)+'"><span class="lt-dot"></span>'+nkEsc(x.name.replace('Platinum Plus','Plat. Plus'))+(mine&&i===mi?'<i>You</i>':'')+'</button>';}).join('')+'</div>'+
      '<div class="lvl-head tier-'+t.key+'"><div><p class="kicker">'+nkEsc(t.name)+'</p><h2>'+t.discount+'% off · '+earnTxt(t.earn)+' / ₹100</h2><p class="lvl-status'+(locked?' locked':'')+'">'+(locked?ICON_LOCK:ICON_CHECK)+status+'</p></div></div>'+
      '<p class="small">'+(si>0?'Everything in '+nkEsc(ts[si-1].name)+' is included. New and better benefits are marked.':'Every member starts here.')+'</p>'+
      '<ul class="perks-list">'+list+'</ul>';
  }
  function compareHTML(mine){
    var ts=tiers(),ids=[['rate','Member rate'],['points','Points per ₹100'],['earlyci','Early check-in'],['latecheckout','Late check-out'],['upgrade','Room upgrade'],['dental','Dental kit'],['mattress','Extra mattress'],['festival','Festival priority'],['birthday','Birthday points']];
    var short={rate:function(t){return t.discount+'%';},points:function(t){return String(t.earn);},birthday:function(t){return String(t.birthday||'');}};
    var per=ts.map(function(t){var o={};perksOf(t.key).forEach(function(p){o[p.id]=p.text;});return o;});
    return '<div class="cmp-wrap"><table class="cmp"><thead><tr><th></th>'+ts.map(function(t){return '<th class="tier-'+t.key+(mine===t.key?' me':'')+'"><span class="lt-dot"></span>'+nkEsc({silver:'Silver',gold:'Gold',platinum:'Plat.',plus:'Plus'}[t.key]||t.name)+'</th>';}).join('')+'</tr></thead><tbody>'+
      ids.map(function(r){return '<tr><th>'+r[1]+'</th>'+ts.map(function(t,i){var v=per[i][r[0]];var cell=short[r[0]]?short[r[0]](t):v?(r[0]==='latecheckout'?(/12/.test(v)?'12 noon':'11 AM'):'✓'):'–';return '<td class="'+(mine===t.key?'me':'')+(v?'':' no')+'">'+cell+'</td>';}).join('')+'</tr>';}).join('')+
      '</tbody></table></div>';
  }
  function levelsScreen(sel){
    tabs.hidden=true;setTop('Back',home);
    show('<div style="display:grid;gap:8px"><p class="kicker">Nikadi Membership</p><h1 class="title">Levels &amp; benefits</h1><p class="sub">Four levels. The more nights you stay with us, the more you get.</p></div>'+
      '<div id="lvlBox">'+benefitsHTML(sel||'silver','')+'</div>'+
      '<div style="display:grid;gap:10px"><p class="kicker">Compare all levels</p>'+compareHTML('')+'</div>'+
      '<button class="btn btn-gold" type="button" id="lvJoin">Join free · '+S.cfg.welcome+' points</button>');
    wireLevels('');$('lvJoin').onclick=function(){join();};
  }
  function wireLevels(mine){
    var box=$('lvlBox');if(!box)return;
    box.onclick=function(e){var b=e.target.closest('[data-lvl]');if(!b)return;box.innerHTML=benefitsHTML(b.dataset.lvl,mine);};
  }

  function phoneField(id,label){return '<label class="field"><span>'+label+'</span><div class="phonewrap"><span class="cc">+91</span><input class="input" id="'+id+'" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="10-digit mobile number"></div></label>';}
  function pwField(id,label,auto){return '<label class="field"><span>'+label+'</span><div class="pwwrap"><input class="input" id="'+id+'" type="password" autocomplete="'+(auto||'current-password')+'" maxlength="64"><button type="button" class="pwshow" data-for="'+id+'" aria-label="Show password">Show</button></div></label>';}
  function wirePw(){document.querySelectorAll('.pwshow').forEach(function(b){b.onclick=function(){var i=$(b.dataset.for);var on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'Hide':'Show';};});}
  function signedIn(r,msg){S.token=r.token;nkStore('nk_token',r.token);S.member=r.member;S.history=r.history||[];S.stays=r.stays||{stays:[],bookings:[]};dash('card');if(msg)toast(msg);}

  /* ---------- logged-out home ---------- */
  function home(){
    tabs.hidden=true;setTop('Join',function(){join();});
    var ready=!!NIKADI_API_URL||NIKADI.demo;
    show(
      (ready?'':'<div class="note"><b>Launching soon</b>The Nikadi member app is being set up.</div>')+
      '<div style="display:grid;gap:8px"><p class="kicker">Nikadi Membership</p><h1 class="title">Stay more. Rise higher.</h1>'+
      '<p class="sub">Member rates on every booking, points on every stay, and four levels from Silver to Platinum Plus.</p></div>'+
      '<form class="panel" id="loginForm" novalidate><h2>Member login</h2>'+phoneField('lgPhone','Mobile number')+pwField('lgPw','Password')+
        '<p class="err" id="lgErr"></p><button class="btn btn-gold" id="lgBtn" type="submit">Log in</button>'+
        '<button class="linkbtn" type="button" id="forgot">Forgot password, or first time logging in?</button></form>'+
      '<div class="join-cta"><div><b>Not a member yet?</b><span>Join free and get '+S.cfg.welcome+' welcome points.</span></div><button class="btn btn-line" type="button" id="goJoin">Join free</button></div>'+
      '<div style="display:grid;gap:12px"><div class="sec-row"><p class="kicker">Membership levels</p><button class="linkbtn" type="button" id="seeLevels">See all benefits</button></div>'+ladderHTML('')+'<p class="small">Tap a level to see its benefits.</p></div>'+
      installHTML()+
      '<div class="links"><a class="btn btn-quiet" href="../#home">Website</a><a class="btn btn-quiet" href="'+nkWa('Hare Krishna! I have a question about Nikadi Membership.')+'" target="_blank" rel="noopener">WhatsApp us</a></div>'+
      '<p class="foot">Nikadi Guest House · Opp. ISKCON Gate No. 4, Sri Dham Mayapur</p>'
    );
    $('goJoin').onclick=function(){join();};wireInstall();wirePw();
    view.querySelectorAll('[data-rung]').forEach(function(r){r.onclick=function(){levelsScreen(r.dataset.rung);};});
    $('seeLevels').onclick=function(){levelsScreen('silver');};
    $('forgot').onclick=function(){passFlow(nkPhoneOk($('lgPhone').value)||'');};
    $('loginForm').onsubmit=function(e){
      e.preventDefault();var p=nkPhoneOk($('lgPhone').value),pw=$('lgPw').value,err=$('lgErr'),b=$('lgBtn');err.textContent='';
      if(!p){err.textContent=nkError('invalid_phone');return;}
      if(!pw){err.textContent='Please enter your password.';return;}
      busy(b,true);
      nkApi('login',{phone:p,password:pw}).then(function(r){busy(b,false);signedIn(r,'Welcome back, '+r.member.firstName+'!');},function(c){
        busy(b,false);err.textContent=nkError(c);
        if(c==='no_password'){err.innerHTML=nkEsc(nkError(c))+' <a href="#" id="np" style="color:var(--gold-hi)">Set my password</a>';$('np').onclick=function(ev){ev.preventDefault();passFlow(p);};}
        if(c==='not_member'){err.innerHTML+=' <a href="#" id="jl" style="color:var(--gold-hi)">Join now</a>';$('jl').onclick=function(ev){ev.preventDefault();join(p);};}
      });
    };
  }
  function installHTML(){
    if(standalone)return '';
    if(isIOS)return '<div class="install"><span>Add Nikadi to your home screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span></div>';
    return '<div class="install" id="installBox"'+(installEvt?'':' hidden')+'><span>Install the Nikadi app on your phone.</span><button class="btn btn-gold" type="button" id="installBtn">Install</button></div>';
  }
  function wireInstall(){var b=$('installBtn');if(b)b.onclick=function(){if(!installEvt)return;installEvt.prompt();installEvt.userChoice.then(function(){installEvt=null;$('installBox').hidden=true;});};}

  /* ---------- set / reset password with an emailed code ---------- */
  function passFlow(prefill){
    tabs.hidden=true;setTop('Back',home);
    show('<div style="display:grid;gap:8px"><p class="kicker">Password</p><h1 class="title">Set a new password</h1><p class="sub">We will email a 6-digit code to the address on your membership.</p></div>'+
      '<form class="panel" id="pwForm" novalidate>'+phoneField('psPhone','Member mobile number')+
      '<div id="psStep" hidden><label class="field"><span>6-digit code</span><input class="input otp" id="psCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></label><p class="small" id="psTo"></p>'+
      pwField('psPw','New password (at least 6 characters)','new-password')+'</div>'+
      '<p class="err" id="psErr"></p><button class="btn btn-gold" id="psBtn" type="submit">Email me a code</button></form>');
    wirePw();if(prefill)$('psPhone').value=prefill;
    var phone='',step=1;
    $('pwForm').onsubmit=function(e){
      e.preventDefault();var err=$('psErr'),b=$('psBtn');err.textContent='';
      if(step===1){
        phone=nkPhoneOk($('psPhone').value);if(!phone){err.textContent=nkError('invalid_phone');return;}
        busy(b,true);
        nkApi('passStart',{phone:phone}).then(function(r){busy(b,false);step=2;$('psStep').hidden=false;$('psPhone').readOnly=true;$('psTo').textContent='Code sent to '+r.to+'. It is valid for 10 minutes.';b.textContent='Save password and log in';$('psCode').focus();},
          function(c){busy(b,false);err.textContent=nkError(c);});
        return;
      }
      var code=$('psCode').value.replace(/\D/g,''),pw=$('psPw').value;
      if(code.length!==6){err.textContent='Please enter the 6-digit code.';return;}
      if(pw.length<6){err.textContent=nkError('weak_password');return;}
      busy(b,true);
      nkApi('passSet',{phone:phone,code:code,password:pw}).then(function(r){busy(b,false);signedIn(r,'Password saved. Welcome, '+r.member.firstName+'!');},function(c){busy(b,false);err.textContent=nkError(c);});
    };
  }

  /* ---------- join ---------- */
  function join(prefill){
    tabs.hidden=true;setTop('Back',home);
    show('<div style="display:grid;gap:8px"><p class="kicker">Free to join</p><h1 class="title">Become a Nikadi member</h1><p class="sub">Get '+S.cfg.welcome+' welcome points and Silver member rates (5% off) right away. Your mobile number is your member ID.</p></div>'+
      '<form class="panel" id="joinForm" novalidate>'+
      '<label class="field"><span>Full name <i>*</i></span><input class="input" id="jName" autocomplete="name"></label>'+
      phoneField('jPhone','Mobile number <i>*</i>')+
      '<label class="field"><span>Email <i>*</i></span><input class="input" id="jEmail" type="email" autocomplete="email" inputmode="email"><span class="small">For your booking updates and password resets.</span></label>'+
      pwField('jPw','Choose a password <i>*</i>','new-password')+
      '<label class="field"><span>City <i>*</i></span><input class="input" id="jCity" autocomplete="address-level2"></label>'+
      '<label class="field"><span>Date of birth (optional)</span><input class="input" id="jDob" type="date"></label>'+
      '<label class="check"><input type="checkbox" id="jAgree"> I agree to the Nikadi Membership terms. Points are earned on room tariff paid and added after check-out.</label>'+
      '<p class="err" id="jErr"></p><button class="btn btn-gold" id="jBtn" type="submit">Join and get '+S.cfg.welcome+' points</button></form>'+
      '<p class="small" style="text-align:center">Already a member? <a href="#" id="toLogin" style="color:var(--gold-hi)">Log in</a></p>');
    wirePw();if(typeof prefill==='string')$('jPhone').value=prefill;
    $('toLogin').onclick=function(e){e.preventDefault();home();};
    $('joinForm').onsubmit=function(e){
      e.preventDefault();var err=$('jErr'),b=$('jBtn');err.textContent='';
      var d={name:$('jName').value.trim(),phone:nkPhoneOk($('jPhone').value),email:$('jEmail').value.trim(),password:$('jPw').value,city:$('jCity').value.trim(),dob:$('jDob').value};
      if(d.name.length<2)return err.textContent=nkError('name_required');
      if(!d.phone)return err.textContent=nkError('invalid_phone');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email))return err.textContent='Please enter your email address.';
      if(d.password.length<6)return err.textContent=nkError('weak_password');
      if(!d.city)return err.textContent='Please enter your city.';
      if(!$('jAgree').checked)return err.textContent='Please agree to the membership terms.';
      busy(b,true);
      nkApi('join',d).then(function(r){busy(b,false);signedIn(r,'Welcome to Nikadi, '+r.member.firstName+'! '+r.member.points+' points added.');},
        function(c){busy(b,false);err.textContent=nkError(c);if(c==='already_member'){err.innerHTML+=' <a href="#" id="tl" style="color:var(--gold-hi)">Log in</a>';$('tl').onclick=function(ev){ev.preventDefault();home();};}});
    };
  }

  /* ---------- dashboard ---------- */
  var BST={Pending:'Waiting for payment',Confirmed:'Confirmed','Checked in':'Stayed',Cancelled:'Cancelled','No-show':'No-show'};
  function bookingHTML(b){
    return '<div class="stay"><div class="stay-top"><b>'+nkEsc(dS(b.checkin))+' → '+nkEsc(dS(b.checkout))+'</b><span class="chip s-'+nkEsc(String(b.status).toLowerCase().replace(/\s+/g,'-'))+'">'+nkEsc(BST[b.status]||b.status)+'</span></div>'+
      '<p>'+b.nights+' night'+(b.nights>1?'s':'')+' · '+b.guests+' guest'+(b.guests>1?'s':'')+' · '+(b.rooms?'Room '+nkEsc(b.rooms):nkEsc(b.roomType))+'</p>'+
      '<p class="stay-money"><span>'+nkInr(b.rate)+' / night · total '+nkInr(b.total)+'</span><span>'+(b.status==='Pending'?'Advance '+nkInr(b.advanceDue)+' to confirm':b.advancePaid?'Paid '+nkInr(b.advancePaid-(b.refunded||0)):'')+'</span></p></div>';
  }
  function stayHTML(s){
    return '<div class="stay"><div class="stay-top"><b>'+nkEsc(dS(s.checkin))+' → '+nkEsc(dS(s.checkout))+'</b><span class="chip">'+(s.status==='In house'?'Staying now':'Room '+nkEsc(s.room))+'</span></div>'+
      '<p>'+s.nights+' night'+(s.nights>1?'s':'')+' · '+nkInr(s.rate)+' per night</p>'+
      '<p class="stay-money"><span>Room '+nkInr(s.roomTotal)+(s.extras?' + extras '+nkInr(s.extras):'')+'</span><span>Paid '+nkInr(s.paid)+'</span></p></div>';
  }
  function dash(tab){
    S.tab=tab||S.tab;tabs.hidden=false;setTop('Log out',logout);
    tabs.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.tab===S.tab?'true':'false');});
    var m=S.member,t=tierBy(m.tierKey||'silver');
    var upcoming=(S.stays.bookings||[]).filter(function(b){return (b.status==='Pending'||b.status==='Confirmed')&&b.checkout>=today();});
    if(S.tab==='card'){
      show('<div style="display:grid;gap:6px"><p class="kicker">Hare Krishna</p><h1 class="title">'+nkEsc(m.firstName)+'</h1></div>'+
        cardHTML(m)+tierProgress(m)+
        '<div class="perks"><div><b>'+t.discount+'%</b><span>off every booking</span></div><div><b>'+(t.earn%1?t.earn.toFixed(1):t.earn)+'</b><span>points per ₹100</span></div><div><b>'+m.nights2y+'</b><span>nights in '+S.cfg.windowYears+' years</span></div></div>'+
        (upcoming.length?'<div style="display:grid;gap:10px"><p class="kicker">Your next stay</p>'+bookingHTML(upcoming.slice().sort(function(x,y){return x.checkin<y.checkin?-1:1;})[0])+'</div>':'')+
        '<div class="links"><button class="btn btn-gold" type="button" id="bookNow">Book at your member rate</button><a class="btn btn-line" href="'+nkWa('Hare Krishna! I am a Nikadi '+(m.tier||'')+' member ('+m.masked+').')+'" target="_blank" rel="noopener">WhatsApp us</a></div>'+
        '<div style="display:grid;gap:10px"><div class="sec-row"><p class="kicker">Your '+nkEsc(m.tier)+' benefits</p><button class="linkbtn" type="button" id="allBen">All levels</button></div>'+
          '<ul class="perks-list compact">'+perksOf(m.tierKey).slice(0,6).map(function(p){return '<li class="perk"><span class="pk-ic">'+ICON_CHECK+'</span><span class="pk-t">'+nkEsc(p.text)+'</span></li>';}).join('')+'</ul>'+
          '<button class="btn btn-line" type="button" id="benMore">See all your benefits</button></div>'+
        '<div style="display:grid;gap:12px"><p class="kicker">Levels</p>'+ladderHTML(m.tierKey)+'<p class="small">Tap a level to see what it includes.</p></div>'+installHTML());
      animateFill();wireInstall();$('bookNow').onclick=function(){dash('book');};
      $('allBen').onclick=$('benMore').onclick=function(){S.lvl=m.tierKey;dash('benefits');};
      view.querySelectorAll('[data-rung]').forEach(function(r){r.onclick=function(){S.lvl=r.dataset.rung;dash('benefits');};});
    } else if(S.tab==='benefits'){
      var sel=S.lvl||m.tierKey;S.lvl=null;
      show('<div style="display:grid;gap:6px"><p class="kicker">Your level: '+nkEsc(m.tier)+'</p><h1 class="title">Benefits</h1><p class="sub">Tap any level to see what it includes and what you would unlock next.</p></div>'+
        '<div id="lvlBox">'+benefitsHTML(sel,m.tierKey)+'</div>'+
        '<div class="note"><b>Using your benefits</b>Show your member card at reception, or mention it when you book. Benefits marked “when available” depend on the day\'s rooms.</div>'+
        '<div style="display:grid;gap:10px"><p class="kicker">Compare all levels</p>'+compareHTML(m.tierKey)+'</div>');
      wireLevels(m.tierKey);
    } else if(S.tab==='book'){
      var t0=today(),types=Object.keys(S.cfg.rates||RATES);
      show('<div style="display:grid;gap:6px"><p class="kicker">'+nkEsc(m.tier)+' member rate · '+t.discount+'% off</p><h1 class="title">Book your stay</h1></div>'+
        '<form class="panel" id="bkForm" novalidate>'+
        '<div class="field"><span>Room</span><div class="roompick" id="bkRoom">'+types.map(function(k,i){var base=S.cfg.rates[k],mr=Math.round(base*(100-t.discount)/100);
          return '<button type="button" data-room="'+nkEsc(k)+'" aria-pressed="'+(i===0)+'"><b>'+nkEsc(k)+'</b><span><s>'+nkInr(base)+'</s> '+nkInr(mr)+' / night</span></button>';}).join('')+'</div></div>'+
        '<div class="row2"><label class="field"><span>Check-in</span><input class="input" type="date" id="bkIn" min="'+t0+'" value="'+addDays(t0,1)+'"></label>'+
        '<label class="field"><span>Check-out</span><input class="input" type="date" id="bkOut" min="'+addDays(t0,1)+'" value="'+addDays(t0,3)+'"></label></div>'+
        '<label class="field"><span>Guests</span><input class="input" id="bkGuests" inputmode="numeric" value="2"><span class="small" id="bkHint">Up to 3 guests per room.</span></label>'+
        '<label class="field"><span>Notes (optional)</span><textarea class="input" id="bkNotes" rows="2" maxlength="200" placeholder="Arrival time, special requests…"></textarea></label>'+
        '<div class="sum" id="bkSum"></div>'+
        '<div class="note"><b>Advance and cancellation</b>'+POLICY+'</div>'+
        '<p class="err" id="bkErr"></p><button class="btn btn-gold" id="bkBtn" type="submit">Send booking request</button>'+
        '<p class="small">We check availability and send payment details on WhatsApp. Your booking is confirmed once the 50% advance is received.</p></form>');
      var room=types[0];
      function sum(){
        var n=nightsOf($('bkIn').value,$('bkOut').value),g=Math.max(1,+$('bkGuests').value.replace(/\D/g,'')||1),rn=Math.ceil(g/3),base=S.cfg.rates[room],mr=Math.round(base*(100-t.discount)/100);
        $('bkHint').textContent=g>3?g+' guests need '+rn+' rooms (up to 3 per room).':'Up to 3 guests per room.';
        $('bkSum').innerHTML=n>0?'<div><span>'+n+' night'+(n>1?'s':'')+' × '+rn+' room'+(rn>1?'s':'')+' × '+nkInr(mr)+'</span><b>'+nkInr(n*rn*mr)+'</b></div>'+
          '<div class="save"><span>You save as '+nkEsc(m.tier)+'</span><b>'+nkInr(n*rn*(base-mr))+'</b></div><div><span>Advance to confirm (50%)</span><b>'+nkInr(Math.ceil(n*rn*mr/2))+'</b></div>'+
          '<div><span>Points you will earn</span><b>~'+Math.floor(n*rn*mr/100*t.earn)+'</b></div>':'<div><span>Check-out must be after check-in</span></div>';
      }
      $('bkRoom').onclick=function(e){var b=e.target.closest('button');if(!b)return;room=b.dataset.room;$('bkRoom').querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});sum();};
      ['bkIn','bkOut','bkGuests'].forEach(function(id){$(id).addEventListener('input',sum);});sum();
      $('bkForm').onsubmit=function(e){
        e.preventDefault();var err=$('bkErr'),b=$('bkBtn');err.textContent='';
        var d={token:S.token,roomType:room,checkin:$('bkIn').value,checkout:$('bkOut').value,guests:Math.max(1,+$('bkGuests').value.replace(/\D/g,'')||1),notes:$('bkNotes').value};
        d.roomsNeeded=Math.ceil(d.guests/3);
        if(nightsOf(d.checkin,d.checkout)<1||d.checkin<today())return err.textContent=nkError('bad_dates');
        busy(b,true);
        nkApi('book',d).then(function(r){
          busy(b,false);S.stays=r.stays||S.stays;
          show('<div style="display:grid;gap:8px;text-align:center;justify-items:center"><p class="kicker">Request sent</p><h1 class="title">Thank you, '+nkEsc(m.firstName)+'!</h1>'+
            '<p class="sub">We have your request for '+nkEsc(dS(d.checkin))+' to '+nkEsc(dS(d.checkout))+' at your '+nkEsc(m.tier)+' rate of '+nkInr(r.rate)+' per night. We will message you on WhatsApp with availability and payment details.</p></div>'+
            '<a class="btn btn-gold" target="_blank" rel="noopener" href="'+nkWa('Hare Krishna! I just sent booking request '+r.booking+' from the member app ('+dS(d.checkin)+' to '+dS(d.checkout)+', '+d.guests+' guests).')+'">Message us on WhatsApp</a>'+
            '<button class="btn btn-line" type="button" id="toStays">See my bookings</button>');
          $('toStays').onclick=function(){dash('stays');};
        },function(c){busy(b,false);err.textContent=nkError(c);});
      };
    } else if(S.tab==='stays'){
      var bk=S.stays.bookings||[],st=S.stays.stays||[];
      var spent=st.reduce(function(a,s){return a+Number(s.roomTotal||0)+Number(s.extras||0);},0);
      show('<div style="display:grid;gap:6px"><p class="kicker">Your stays</p><h1 class="title">History</h1></div>'+
        '<div class="perks"><div><b>'+m.nightsAll+'</b><span>nights with us</span></div><div><b>'+st.length+'</b><span>stays</span></div><div><b>'+nkInr(spent)+'</b><span>total</span></div></div>'+
        '<div style="display:grid;gap:10px"><p class="kicker">Bookings</p>'+(bk.length?bk.map(bookingHTML).join(''):'<div class="empty">No bookings yet. <a href="#" id="toBook" style="color:var(--gold-hi)">Book a stay</a></div>')+'</div>'+
        '<div style="display:grid;gap:10px"><p class="kicker">Past stays</p>'+(st.length?st.map(stayHTML).join(''):'<div class="empty">Your stays appear here after check-out.</div>')+'</div>');
      var tb=$('toBook');if(tb)tb.onclick=function(e){e.preventDefault();dash('book');};
    } else {
      var dp=S.cfg.discountPoints,np=S.cfg.freeNightPoints,discCount=Math.floor(m.points/dp);
      show('<div style="display:grid;gap:6px"><p class="kicker">Rewards</p><h1 class="title">Use your '+m.points.toLocaleString('en-IN')+' points</h1></div>'+
        pointsProgress(m.points)+
        '<div class="rewards">'+
        rewardHTML('<path d="M7 7h.01M3 12l9-9h7v7l-9 9z"/>',nkInr(S.cfg.discountValue)+' off',dp+' points · any booking',m.points>=dp?(discCount>1?discCount+' available':'Available'):(dp-m.points)+' to go',m.points>=dp)+
        rewardHTML('<path d="M3 18v-6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6M3 14h18M6 9V6h4v3"/>','Free night',np+' points · any room',m.points>=np?'Available':(np-m.points)+' to go',m.points>=np)+
        '</div>'+
        '<div class="panel"><h2>Redeeming</h2><p class="sub">Tell us when you book, or at the front desk. We email you a one-time code; share it with our staff and the reward is applied to your bill. Free nights are subject to availability.</p>'+
        '<a class="btn btn-line" href="'+nkWa('Hare Krishna! I am a Nikadi member ('+m.masked+') and want to redeem my points.')+'" target="_blank" rel="noopener">Ask to redeem on WhatsApp</a></div>'+
        '<div style="display:grid;gap:10px"><p class="kicker">Points history · lifetime '+(m.lifetime||0).toLocaleString('en-IN')+'</p>'+
        (S.history.length?'<div class="acts">'+S.history.map(actHTML).join('')+'</div>':'<div class="empty">No activity yet.</div>')+'</div>');
      animateFill();
    }
  }
  function rewardHTML(path,title,sub,tag,on){return '<div class="reward"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></span><div><h3>'+title+'</h3><p>'+sub+'</p></div><span class="tag'+(on?' on':'')+'">'+tag+'</span></div>';}
  function actHTML(a){
    var p=Number(a.points)||0,label={Welcome:'Welcome bonus',Stay:'Stay',Redeem:'Redeemed',Adjustment:'Adjustment'}[a.type]||a.type;
    var desc=a.note&&a.note!==label?a.note:'';
    return '<div class="act"><span class="t">'+nkEsc(label)+(desc?' · '+nkEsc(desc):'')+'</span><span class="p '+(p>=0?'plus':'minus')+'">'+(p>=0?'+':'')+p+'<small>bal '+nkEsc(a.balance)+'</small></span><span class="d">'+nkEsc(String(a.date).replace(/T.*$/,''))+(a.amount?' · '+nkInr(a.amount):'')+'</span></div>';
  }
  tabs.addEventListener('click',function(e){var t=e.target.closest('.tab');if(t)dash(t.dataset.tab);});
  function logout(){S.token=null;S.member=null;nkStore('nk_token',null);home();toast('Logged out');}

  /* ---------- start ---------- */
  function start(){
    var cfg=nkApi('config').then(function(c){['pointsPer100','welcome','discountPoints','discountValue','freeNightPoints','channel','tiers','rates','plusYears','windowYears'].forEach(function(k){if(c[k]!=null)S.cfg[k]=c[k];});}).catch(function(){});
    var want=/[?&]join=1/.test(location.search)||location.hash==='#join',wantBook=/[?&]book=1/.test(location.search)||location.hash==='#book';
    if(!S.token){home();cfg.then(function(){if(!S.token){if(want)join();else home();}});return;}
    tabs.hidden=true;setTop('',null);
    view.innerHTML='<div class="mcard ghost" style="opacity:.6" aria-label="Loading your card"></div><p class="small" style="text-align:center">Loading your membership…</p>';
    cfg.then(function(){return nkApi('me',{token:S.token});})
      .then(function(r){S.member=r.member;S.history=r.history||[];S.stays=r.stays||{stays:[],bookings:[]};dash(wantBook?'book':'card');},function(c){S.token=null;nkStore('nk_token',null);home();if(c!=='network')toast(nkError(c));});
  }
  start();
})();
</script>
</body>
</html>
