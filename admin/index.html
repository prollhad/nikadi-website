<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nikadi · Website admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#14110f;--band:#1b1714;--panel:#221d19;--panel-2:#2a241f;--ink:#efe7da;--muted:#b3a796;--line:#3a322b;--gold:#c9a35a;--gold-hi:#e0be7a;--gold-ink:#1a1206;--green:#74c08c;--red:#e86a5b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.35rem}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kick{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.muted{color:var(--muted)}.small{font-size:.82rem;color:var(--muted)}
.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gold)}.btn-gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:500}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.tile,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tile .l{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .n{font-family:"Cormorant Garamond",serif;font-size:2.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile.live{border-color:var(--gold)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:7px;animation:p 1.6s infinite}
.dot.off{background:var(--muted);animation:none}@keyframes p{50%{opacity:.35}}
.up{color:var(--green)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card{margin-bottom:14px}.grid .card{margin:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.82rem;background:none;border:0;color:var(--muted);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.bars{display:flex;align-items:flex-end;gap:2px;height:190px;border-bottom:1px solid var(--line);position:relative}
.bars .b{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative}
.bars .b i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:1px}
.bars .b:hover i{background:var(--gold-hi)}.bars .b.z i{background:var(--line)}
.bars.h{height:110px}
.ax{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:6px}
.tip{position:fixed;z-index:9;background:#0d0b0a;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;pointer-events:none;white-space:nowrap}
.tip b{display:block;font-weight:500}
.rows{display:grid;gap:9px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.row .m{grid-column:1/-1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}.row .m i{display:block;height:100%;background:var(--gold);border-radius:3px}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
th{text-align:left;font-weight:400;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-left:4px}
.tag.g{border-color:var(--gold);color:var(--gold-hi)}.tag.bad{border-color:var(--red);color:var(--red)}.tag.on{border-color:var(--green);color:var(--green)}
input.in{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;max-width:320px}
.sec{margin:34px 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.login{max-width:380px;margin:12vh auto;text-align:center}.login .card{text-align:left}
.err{color:var(--red);min-height:1.4em;font-size:.88rem}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
nav.tabs a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid transparent;font-size:.92rem}
nav.tabs a:hover{border-color:var(--line);color:var(--ink)}nav.tabs a[aria-current=page]{background:var(--gold);color:var(--gold-ink);font-weight:500}
tr.go{cursor:pointer}tr.go:hover td{background:var(--panel-2)}tr.sub td{background:var(--band);color:var(--gold-hi);font-weight:500}
.back{display:inline-block;color:var(--gold-hi);text-decoration:none;margin-bottom:10px;font-size:.9rem}.back:hover{text-decoration:underline}
.trail{white-space:normal;color:var(--muted);font-size:.84rem;line-height:1.5}.trail b{color:var(--ink);font-weight:400}
.bars .b[data-i]{cursor:pointer}.lnk{color:var(--gold-hi);font-size:.86rem;text-decoration:none}.lnk:hover{text-decoration:underline}
td.w{white-space:normal}
@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:1.6rem}.bars{height:150px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<div class="tip" id="tip" hidden></div>
<script>
(function(){
  var API='https://ebwdrqdsexjterbxyeoa.supabase.co/functions/v1/api',app=document.getElementById('app'),tip=document.getElementById('tip'),D=null,RANGE=30,Q='',timer=null;
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
  ls('nk_notrack','1'); /* this device is the owner's: its own visits to the website are not counted */
  function tok(){return ls('nk-admin-token')||'';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function post(b){return fetch(API,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();});}
  function num(n){return Number(n||0).toLocaleString('en-IN');}
  function dur(s){s=Math.round(s||0);if(s<60)return s+' sec';var m=Math.floor(s/60);if(m<60)return m+' min'+(s%60&&m<10?' '+(s%60)+' sec':'');return Math.floor(m/60)+' h '+(m%60)+' min';}
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function dshort(d){var p=String(d).split('-');return Number(p[2])+' '+MON[p[1]-1];}
  function dlong(d){var p=String(d).split('-'),x=new Date(Date.UTC(+p[0],p[1]-1,+p[2]));return WD[x.getUTCDay()]+' '+dshort(d);}
  function clock(t){var h=Number(String(t).slice(11,13)),m=String(t).slice(14,16);return ((h%12)||12)+':'+m+(h<12?' am':' pm');}
  function when(t){var d=String(t).slice(0,10);return (d===D.today?'Today':dshort(d))+', '+clock(t);}
  var PAGE={'/':'Home','/temple':'Temple & darshan','/travel':'Getting to Mayapur','/things-to-do':'Things to do','/membership':'Membership','/about':'About us','/app/':'Member app','/app':'Member app'};
  function page(p){return PAGE[p]||p;}
  var REF={'google.com':'Google search','Direct':'Typed the address / link in an app','instagram.com':'Instagram','l.instagram.com':'Instagram','facebook.com':'Facebook','m.facebook.com':'Facebook','l.facebook.com':'Facebook','lm.facebook.com':'Facebook','bing.com':'Bing search','youtube.com':'YouTube','wa.me':'WhatsApp','web.whatsapp.com':'WhatsApp','api.whatsapp.com':'WhatsApp','maps.google.com':'Google Maps','duckduckgo.com':'DuckDuckGo','t.co':'X (Twitter)','chatgpt.com':'ChatGPT'};
  function ref(r){if(!r)return 'Direct';if(REF[r])return REF[r];if(/^google\./.test(r)||/\.google\./.test(r))return 'Google';return r;}
  var TZ={'Asia/Kolkata':'India','Asia/Calcutta':'India','Asia/Dhaka':'Bangladesh','Asia/Kathmandu':'Nepal','Asia/Dubai':'UAE','Asia/Singapore':'Singapore','Europe/London':'United Kingdom','Europe/Moscow':'Russia','Europe/Kyiv':'Ukraine','Europe/Kiev':'Ukraine','Europe/Berlin':'Germany','Europe/Paris':'France','Europe/Rome':'Italy','Europe/Madrid':'Spain','Asia/Shanghai':'China','Asia/Tokyo':'Japan','Australia/Sydney':'Australia','Australia/Melbourne':'Australia','America/Sao_Paulo':'Brazil','Asia/Colombo':'Sri Lanka','Asia/Kuala_Lumpur':'Malaysia','Asia/Bangkok':'Thailand','Asia/Jakarta':'Indonesia'};
  function place(z){if(!z||z==='Unknown')return 'Unknown';if(TZ[z])return TZ[z];if(/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Detroit)/.test(z))return 'United States';if(/^America\/(Toronto|Vancouver|Edmonton|Winnipeg)/.test(z))return 'Canada';return z.split('/').pop().replace(/_/g,' ');}
  function chg(a,b){if(!b)return a?'<span class="up">new</span>':'';var p=Math.round((a-b)/b*100);if(!p)return 'same as before';return '<span class="'+(p>0?'up':'down')+'">'+(p>0?'▲ ':'▼ ')+Math.abs(p)+'%</span> vs the '+'time before';}
  function tile(l,n,s,cls){return '<div class="tile '+(cls||'')+'"><div class="l">'+l+'</div><div class="n">'+n+'</div><div class="s">'+(s||'&nbsp;')+'</div></div>';}
  function list(a,name,max){if(!a.length)return '<p class="empty">Nothing yet.</p>';var top=a[0][1]||1,tot=0;a.forEach(function(x){tot+=x[1];});
    return '<div class="rows">'+a.slice(0,max||10).map(function(x){return '<div class="row"><span class="t">'+esc(name(x[0]))+'</span><span class="v">'+num(x[1])+' · '+Math.round(x[1]/tot*100)+'%</span><span class="m"><i style="width:'+Math.max(2,x[1]/top*100)+'%"></i></span></div>';}).join('')+'</div>';}
  function merge(a,name){var o={};a.forEach(function(x){var k=name(x[0]);o[k]=(o[k]||0)+x[1];});return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(x,y){return y[1]-x[1];});}

  function errOf(e){return e==='wrong_login'?'The user name or password is not right.':e==='wrong_pin'?'That PIN is not right.':e==='too_many_attempts'?'Too many wrong tries. Wait 15 minutes.':e==='bad_user'?'User name: 3 to 30 letters or numbers, no spaces.':e==='bad_pass'?'Password: at least 4 characters.':e==='not_allowed'?'Only the owner can do this.':'Could not do that ('+e+').';}
  function shell(inner){clearInterval(timer);app.innerHTML='<div class="login"><p class="kick">Nikadi Guest House</p><h1>Website admin</h1>'+inner+'</div>';}
  function login(msg){
    shell('<p class="muted">Sign in to see the website figures.</p><div class="card"><form id="lf"><input class="in" id="au" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" placeholder="User name" style="max-width:none;margin-bottom:10px">'+
      '<input class="in" id="ap" type="password" autocomplete="current-password" maxlength="64" placeholder="Password" style="max-width:none;margin-bottom:10px"><p class="err" id="lerr" role="alert">'+esc(msg||'')+'</p><button class="btn btn-gold" type="submit" style="width:100%">Sign in</button></form></div>'+
      '<p class="small" style="margin-top:14px"><button class="btn" id="setb" type="button">Set or change the admin login</button></p>');
    document.getElementById('setb').onclick=function(){setup(false);};
    document.getElementById('lf').onsubmit=function(e){e.preventDefault();var er=document.getElementById('lerr');er.textContent='';
      post({action:'deskAdminLogin',user:document.getElementById('au').value,pass:document.getElementById('ap').value}).then(function(r){
        if(!r.ok){if(r.error==='no_login')return setup(true);er.textContent=errOf(r.error);return;}ls('nk-admin-token',r.token);load();},function(){er.textContent='No connection. Try again.';});};}
  /* the owner chooses the user name and password here, proving who they are with the staff app PIN; the password is never stored as written */
  function setup(first){
    shell('<p class="muted">'+(first?'First time: choose the user name and password for this page.':'Choose a new user name and password for this page.')+' Only the owner can do this.</p><div class="card"><form id="sf">'+
      '<input class="in" id="spin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Your staff app PIN (owner)" style="max-width:none;margin-bottom:10px">'+
      '<input class="in" id="su" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" placeholder="New user name" style="max-width:none;margin-bottom:10px">'+
      '<input class="in" id="sp" type="password" autocomplete="new-password" maxlength="64" placeholder="New password" style="max-width:none;margin-bottom:10px">'+
      '<input class="in" id="sp2" type="password" autocomplete="new-password" maxlength="64" placeholder="Password again" style="max-width:none;margin-bottom:10px">'+
      '<p class="err" id="serr" role="alert"></p><button class="btn btn-gold" type="submit" style="width:100%">Save and open</button></form></div><p class="small" style="margin-top:14px"><button class="btn" id="bk" type="button">Back to sign in</button></p>');
    document.getElementById('bk').onclick=function(){login();};
    document.getElementById('sf').onsubmit=function(e){e.preventDefault();var er=document.getElementById('serr'),u=document.getElementById('su').value.trim(),p1=document.getElementById('sp').value;er.textContent='';
      if(p1!==document.getElementById('sp2').value){er.textContent='The two passwords are not the same.';return;}
      post({action:'deskLogin',pin:document.getElementById('spin').value}).then(function(r){
        if(!r.ok){er.textContent=errOf(r.error);return;}
        if(r.me.role!=='Owner'){post({action:'deskLogout',token:r.token}).catch(function(){});er.textContent='Only the owner can set the admin login.';return;}
        return post({action:'deskAdminSetLogin',token:r.token,user:u,pass:p1}).then(function(x){post({action:'deskLogout',token:r.token}).catch(function(){});
          if(!x.ok){er.textContent=errOf(x.error);return;}
          return post({action:'deskAdminLogin',user:u,pass:p1}).then(function(y){if(!y.ok){login('Saved. Now sign in.');return;}ls('nk-admin-token',y.token);load();});});
      }).catch(function(){er.textContent='No connection. Try again.';});};}

  var first=true;
  function load(){if(!tok())return login();
    post({action:'deskSiteStats',token:tok()}).then(function(r){
      if(!r.ok){ls('nk-admin-token',null);return login(r.error==='session_expired'||r.error==='not_logged_in'||r.error==='not_allowed'?'':'Could not load ('+r.error+').');}
      D=r;if(!view()[0])draw();else if(first){first=false;route();}first=false;clearInterval(timer);timer=setInterval(function(){if(!document.hidden)load();},60000);
    },function(){if(!D)app.innerHTML='<p class="muted">No connection. <button class="btn" onclick="location.reload()">Try again</button></p>';});}

  function draw(){var d=D,y=window.scrollY;
    var days=d.days.slice(-RANGE),mx=Math.max.apply(null,days.map(function(x){return x.visitors;}).concat([1]));
    var hx=Math.max.apply(null,d.hours.concat([1])),m=d.members,ml=m?m.list:[];
    var tiers=['Silver','Gold','Platinum','Platinum Plus'],bt={},act=0,blk=0,pts=0,j30=0,from30=d.days[d.days.length-30].d;
    ml.forEach(function(x){bt[x.tier]=(bt[x.tier]||0)+1;if(x.status==='Blocked')blk++;else act++;pts+=x.points;if(x.joined>=from30)j30++;});
    var taps=d.month.taps||{},nw=d.month.visits?Math.round(d.month.fresh/Math.max(1,d.month.visitors)*100):0,mob=d.month.visits?Math.round(d.month.mobile/d.month.visits*100):0;
    var q=Q.toLowerCase(),shown=ml.filter(function(x){return !q||(x.name+' '+x.phone+' '+x.city+' '+x.tier+' '+x.status).toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return a.joined<b.joined?1:-1;});
    var h='<div class="top"><div><p class="kick">Nikadi Guest House</p><h1>Website admin</h1><p class="small">Updated '+clock(d.now)+' · refreshes every minute</p></div>'+
      '<div class="acts"><a class="btn" href="/" target="_blank" rel="noopener">Open website</a><a class="btn" href="/staff/">Staff app</a><button class="btn" id="rf" type="button">Refresh</button><button class="btn" id="lo" type="button">Sign out</button></div></div>'+nav('')+
      '<div class="tiles">'+
      tile('On the site now','<span class="dot'+(d.live?'':' off')+'"></span>'+d.live,d.live?d.liveList.map(function(v){return esc(page(v.lastPage));}).filter(function(x,i,a){return a.indexOf(x)===i;}).slice(0,3).join(', '):'Nobody right now','live')+
      tile('Visitors today',num(d.day.visitors),num(d.day.pages)+' pages · yesterday '+num(d.yesterday.visitors))+
      tile('Last 7 days',num(d.week.visitors),chg(d.week.visits,d.prevWeek.visits))+
      tile('Last 30 days',num(d.month.visitors),chg(d.month.visits,d.prevMonth.visits))+
      tile('Time on the site',d.month.avg<60?d.month.avg+' sec':Math.floor(d.month.avg/60)+':'+('0'+d.month.avg%60).slice(-2)+' min','average per visit, 30 days')+
      tile('Members',m?num(ml.length):'–',m?'+'+j30+' in 30 days':'')+'</div>'+
      '<div class="card"><div class="ch"><h2>Visitors each day</h2><div class="seg" id="rg">'+[7,30,90].map(function(n){return '<button type="button" data-n="'+n+'" aria-pressed="'+(n===RANGE)+'">'+n+' days</button>';}).join('')+'</div></div>'+
      '<div class="bars" id="bd">'+days.map(function(x,i){return '<div class="b'+(x.visitors?'':' z')+'" data-i="'+i+'"><i style="height:'+(x.visitors?Math.max(2,x.visitors/mx*100):0)+'%"></i></div>';}).join('')+'</div>'+
      '<div class="ax"><span>'+dshort(days[0].d)+'</span><span>most in a day: '+num(mx===1&&!days.some(function(x){return x.visitors;})?0:mx)+'</span><span>Today</span></div></div>'+
      '<div class="grid"><div class="card"><div class="ch"><h2>Pages people open</h2><span class="small">30 days</span></div>'+list(merge(d.pages,page),function(x){return x;},10)+'</div>'+
      '<div class="card"><div class="ch"><h2>Where they come from</h2><span class="small">30 days</span></div>'+list(merge(d.refs,ref),function(x){return x;},8)+'</div></div>'+
      '<div class="grid"><div class="card"><div class="ch"><h2>What they tap</h2><span class="small">30 days</span></div><div class="rows">'+
        [['wa','WhatsApp buttons'],['book','Book on WhatsApp (from the calendar or form)'],['call','Call buttons'],['join','Membership / member app links']].map(function(x){return '<div class="row"><span class="t">'+x[1]+'</span><span class="v">'+num(taps[x[0]]||0)+'</span></div>';}).join('')+
        '<div class="row"><span class="t">First-time visitors</span><span class="v">'+nw+'%</span></div><div class="row"><span class="t">On a phone</span><span class="v">'+mob+'%</span></div>'+
        '<div class="row"><span class="t">Pages per visit</span><span class="v">'+(d.month.visits?(d.month.pages/d.month.visits).toFixed(1):'0')+'</span></div></div></div>'+
      '<div class="card"><div class="ch"><h2>Countries</h2><span class="small">by the phone or computer\'s time zone, 30 days</span></div>'+list(merge(d.zones,place),function(x){return x;},8)+'</div></div>'+
      '<div class="card"><div class="ch"><h2>Time of day</h2><span class="small">when visits start, India time, 30 days</span></div><div class="bars h" id="bh">'+d.hours.map(function(c,i){return '<div class="b'+(c?'':' z')+'" data-h="'+i+'"><i style="height:'+(c?Math.max(3,c/hx*100):0)+'%"></i></div>';}).join('')+'</div><div class="ax"><span>12 am</span><span>6 am</span><span>12 pm</span><span>6 pm</span><span>11 pm</span></div></div>'+
      '<div class="card"><div class="ch"><h2>Latest visits</h2><a class="lnk" href="#visitors">All days and every visit ›</a></div>'+(d.recent.length?'<div class="tw"><table><thead><tr><th>When</th><th>Stayed</th><th class="n">Pages</th><th>Started on</th><th>Came from</th><th>Device</th><th>Country</th><th></th></tr></thead><tbody>'+
        d.recent.map(function(v){var e=v.ev||{};return '<tr><td>'+when(v.at)+'</td><td>'+dur(v.secs)+'</td><td class="n">'+v.pages+'</td><td>'+esc(page(v.entry))+'</td><td>'+esc(ref(v.ref))+'</td><td>'+esc(v.dev==='mobile'?'Phone':v.dev==='tablet'?'Tablet':'Computer')+'</td><td>'+esc(place(v.tz))+'</td><td>'+

        '<div class="card"><div class="ch"><h2>Stays</h2><span class="small">'+r.stays.length+'</span></div>'+(r.stays.length?'<div class="tw"><table><thead><tr><th>Check-in</th><th>Check-out</th><th class="n">Nights</th><th>Room</th><th>Status</th><th class="n">Room total</th><th class="n">Extras</th><th class="n">Paid</th><th>Bill</th></tr></thead><tbody>'+r.stays.map(function(x){return '<tr><td>'+esc(x.checkin)+'</td><td>'+esc(x.checkout)+'</td><td class="n">'+x.nights+'</td><td>'+esc(x.room)+'</td><td>'+esc(x.status)+'</td><td class="n">'+rs(x.roomTotal)+'</td><td class="n">'+rs(x.extras)+'</td><td class="n">'+rs(x.paid)+'</td><td>'+esc(x.bill)+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="empty">No stays under this phone number.</p>')+'</div>'+
        '<div class="card"><div class="ch"><h2>Bookings</h2><span class="small">'+r.bookings.length+'</span></div>'+(r.bookings.length?bkTable(r.bookings,true):'<p class="empty">No bookings under this phone number.</p>')+'</div>';});}
  function bkTable(l,noGuest){return '<div class="tw"><table><thead><tr><th>Made on</th>'+(noGuest?'':'<th>Guest</th><th>Phone</th>')+'<th>Check-in</th><th>Check-out</th><th class="n">Nights</th><th>Rooms</th><th>Source</th><th>Status</th><th class="n">Total</th><th class="n">Paid so far</th></tr></thead><tbody>'+l.map(function(b){return '<tr><td>'+esc(String(b.created).slice(0,10))+'</td>'+(noGuest?'':'<td>'+esc(b.guest)+'</td><td>'+esc(b.phone)+'</td>')+'<td>'+esc(b.checkin)+'</td><td>'+esc(b.checkout)+'</td><td class="n">'+b.nights+'</td><td>'+esc(b.rooms||b.roomType||'')+'</td><td>'+esc(b.source)+(b.walkin?'<span class="tag">no booking</span>':'')+'</td><td>'+esc(b.status)+'</td><td class="n">'+rs(b.total)+'</td><td class="n">'+rs(b.advancePaid)+'</td></tr>';}).join('')+'</tbody></table></div>';}
  function vBookings(mo){hist({what:'bookings',month:mo||''},function(r){var src={},st={},tot=0,adv=0;r.list.forEach(function(b){src[b.source]=(src[b.source]||0)+1;st[b.status]=(st[b.status]||0)+1;if(!/cancel|no-show/i.test(b.status))tot+=b.total;adv+=b.advancePaid;});
      var top=function(o){return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1];});};
      app.innerHTML=head('Bookings',ym(r.month)+': bookings made and walk-in guests checked in during this month')+nav('bookings')+
        '<div class="card"><div class="ch"><h2>Month</h2></div><div style="display:flex;gap:6px;flex-wrap:wrap">'+(r.months.length?r.months:[[r.month,0]]).map(function(m){return '<a class="btn'+(m[0]===r.month?' btn-gold':'')+'" href="#bookings='+m[0]+'">'+ym(m[0])+' · '+m[1]+'</a>';}).join('')+'</div></div>'+
        '<div class="tiles">'+tile('Bookings made',num(r.list.length),'')+tile('Value',rs(tot),'cancelled and no-show left out')+tile('Paid so far',rs(adv),'advances, and payments from walk-ins')+'</div>'+
        '<div class="grid"><div class="card"><div class="ch"><h2>Where they came from</h2></div>'+list(top(src),function(x){return x;},20)+'</div><div class="card"><div class="ch"><h2>What happened to them</h2></div>'+list(top(st),function(x){return x;},20)+'</div></div>'+
        '<div class="card"><div class="ch"><h2>Every booking</h2><span class="small">newest first</span></div>'+(r.list.length?bkTable(r.list,false):'<p class="empty">No bookings were made in this month.</p>')+'<p class="small" style="margin-top:12px">Walk-in guests who were checked in directly, without a booking, are included and marked "no booking". Each of their rooms is one line, and the date is the day they checked in. To change a booking, use the staff app.</p></div>';});}
  function route(){if(!tok())return login();clearInterval(timer);var v=view();
    if(v[0]==='visitors')vVisitors();else if(v[0]==='day')vDay(v[1]);else if(v[0]==='pages')vPages();else if(v[0]==='members')vMembers();else if(v[0]==='member')vMember(v[1]);else if(v[0]==='bookings')vBookings(v[1]);else if(v[0]==='accounts'||v[0]==='bills'||v[0]==='backup')accounts(v[0]);
    else{if(D){draw();window.scrollTo(0,0);}load();return;}
    if(!D)post({action:'deskSiteStats',token:tok()}).then(function(r){if(r.ok){D=r;if(view()[0]==='members')vMembers();}});}
  /* the accounts part (sales, GST, the PDF maker) is a separate file that is fetched only after sign-in, and only when this tab is opened */
  var accP=null;function need(src){return new Promise(function(ok,bad){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){bad(new Error(src));};document.head.appendChild(s);});}
  function accounts(mode){app.innerHTML=head(mode==='bills'?'Purchase bills':mode==='backup'?'Backup':'Accounts for the CA','')+nav(mode)+'<div class="card"><p class="empty">Opening…</p></div>';wire();
    accP=accP||Promise.all([need('/staff/bill.js?v=97'),need('accounts.js?v=14')]);
    accP.then(function(){if(view()[0]===mode)NkAccounts.open({app:app,post:post,tok:tok,head:head,nav:nav,wire:wire,esc:esc,login:login},mode);},function(){accP=null;app.innerHTML=head('Could not open','')+nav(mode)+'<div class="card"><p class="empty">Could not open this page. Check the internet and try again.</p></div>';wire();});}
  addEventListener('hashchange',route);
  if(view()[0])route();else load();
})();
</script>
